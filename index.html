function join(){if(!window.Peer){say('연결 프로그램을 불러오지 못했어. Chrome 또는 Safari에서 열어줘.');return}const c=(document.getElementById('joinCode').value||roomParam).replace(/\D/g,'');if(c.length!==4){say('4자리 방 코드를 입력해줘.');return}
 saveNick((document.getElementById('nick').value||'친구').trim().slice(0,10)||'친구');code=c;mode='connecting';host=false;practice=false;notice='';const t=++token;peer=new Peer();
 peer.on('open',()=>{if(t!==token)return;conn=peer.connect('ynn-party-'+code,{serialization:'json',reliable:true});conn.on('open',()=>{conn.send({type:'join',name:nick});say('방장에게 참가 요청을 보냈어…')});conn.on('data',m=>{if(!m||typeof m!=='object')return;if(m.type==='reject'){say(m.reason);return}if(m.type==='sync'){players=m.players;const old=game.phase+'|'+game.round;game=m.game;if(old!==game.phase+'|'+game.round){pick='';draft='';localSubmitted=false}mode='room';notice='';history.replaceState(null,'',location.pathname+'?room='+code);draw()}});conn.on('close',()=>say('방장과 연결이 끊겼어. 다시 입장해줘.'));conn.on('error',e=>say('연결 실패: '+(e.message||'네트워크 오류')))});
 peer.on('error',e=>say(e.type==='peer-unavailable'?'방장을 찾지 못했어. 방 코드와 방장 접속 상태를 확인해줘.':'연결 오류: '+(e.message||e.type)));setTimeout(()=>{if(t===token&&mode==='connecting')say('연결이 지연돼. 방장에게 게임을 열어두라고 해줘.')},12000);draw()}
function practiceStart(){saveNick((document.getElementById('nick').value||'나').trim().slice(0,10)||'나');practice=true;host=true;code='연습';mode='room';players=Array.from({length:6},(_,i)=>player(i?'bot'+i:'me',i?fakeNames[i-1]:nick,i));game={phase:'lobby',round:0,total:5};notice='가상 친구 연습방이야.';draw()}
function scores(){return players.slice().sort((a,b)=>b.score-a.score).map((p,i)=>'<div class="score"><span>'+(i===0?'👑 ':'')+p.icon+' '+esc(p.name)+(p.online===false?' (연결 끊김)':'')+'</span><b>'+p.score+'점</b></div>').join('')}
function draw(){tag.textContent=mode==='room'?(practice?'연습 모드':'방 '+code):'친구 초대 버전';let h=notice?'<div class="toast">'+esc(notice)+'</div>':'';
 if(mode==='home')h+='<div class="hero"><div class="em">🦊💣🐹</div><h1>야, 너잖아!</h1><p class="sub">친구 <b>2~20명</b>, 각자 휴대폰으로 접속!<br>다양한 질문과 미션 · 답변 시간 30초</p></div><div class="box"><h2>🎉 친구들과 플레이</h2><label class="label">내 닉네임</label><input id="nick" maxlength="10" value="'+esc(nick)+'" placeholder="닉네임 입력"><label class="label">게임 길이</label><select id="total"><option value="5">5라운드</option><option value="12">12라운드</option></select>'+btn('🏠 새 방 만들기','create',false,'alt')+'<label class="label">친구에게 받은 4자리 초대코드</label><input id="joinCode" inputmode="numeric" maxlength="4" pattern="[0-9]{4}" value="'+esc(roomParam)+'" placeholder="4자리 방 코드">'+btn('🚪 친구 방 입장','join')+'</div>'+btn('🎮 가상 친구와 연습 시작','practice',false,'ghost')+'<div class="note">질문 180개가 중복 없이 나오고, 다 사용한 종류만 새 순서로 반복돼. 친구 접속은 WebRTC 방식이라 일부 통신망에서 연결이 제한될 수 있어.</div>';
 else if(mode==='connecting')h+='<div class="hero"><div class="em">📡🎭📡</div><h2>친구방 연결 중…</h2><p class="sub">몇 초 걸릴 수 있어.</p></div>'+btn('처음으로 돌아가기','leave',false,'ghost');
 else if(mode==='room'){
  if(game.phase==='lobby'){h+='<div class="hero"><div class="em">🎉🦊🎉</div><h2>친구 대기실</h2><p class="sub">방장 포함 <b>2명부터</b> 시작 · 질문 제한 시간 <b>30초</b></p></div>';
   if(!practice)h+='<div class="box"><div class="center sub">우리 방 4자리 초대코드</div><div class="code">'+code+'</div><label class="label">친구에게 보낼 초대 주소</label><input id="inviteLink" readonly value="'+esc(url())+'">'+btn('📤 휴대폰 공유 메뉴 열기','share',false,'alt')+btn('📋 초대 링크 복사','copyLink')+btn('🔢 4자리 방 코드 복사','copyCode',false,'ghost')+btn('❓ 카카오톡으로 초대하는 방법','help',false,'ghost')+(help?'<div class="help"><b>카카오톡 초대 방법</b><br>1. 초대 링크 복사 누르기<br>2. 카카오톡 채팅방 열기<br>3. 입력창 길게 누르고 붙여넣기 → 전송<br>4. 친구가 링크를 열고 닉네임 입력 후 방 입장<br>복사가 안 되면 위 주소를 길게 눌러 복사해줘.</div>':'')+'</div>';
   h+='<h2>참가자 '+players.length+' / 20명</h2><div class="people">'+players.map((p,i)=>'<div class="person"><i>'+p.icon+'</i>'+esc(p.name)+(i===0?' 👑':'')+'</div>').join('')+'</div>';
   h+=host?btn(players.length>=2?'🎬 게임 시작하기':'👥 친구 1명만 더 기다려줘','start',players.length<2):'<div class="note">방장이 시작하면 자동으로 게임 화면으로 넘어가!</div>';
  }else if(game.phase==='question'){
   const q=game.q,k=q.kind,answered=localSubmitted||Object.prototype.hasOwnProperty.call(game.answers||{},myId());
   h+='<span class="pill">ROUND '+(game.round+1)+' / '+game.total+'</span><span class="time">⏱ <span id="timer">'+Math.max(0,Math.ceil((game.deadline-Date.now())/1000))+'</span>초</span><div class="progress"><div style="width:'+Math.round((game.round+1)/game.total*100)+'%"></div></div><h2>'+kindNames[k]+'</h2>';
   if(k==='vote'||k==='confession')h+='<div class="paper"><strong>'+esc(q.text)+'</strong><p>'+(k==='vote'?'가장 어울리는 친구는?':'이 고백을 한 사람은 누구일까?')+'</p></div><div class="people">'+players.filter(p=>p.id!==myId()).map(p=>'<button class="person '+(pick===p.id?'sel':'')+'" data-act="pick" data-v="'+esc(p.id)+'" '+(answered?'disabled':'')+'><i>'+p.icon+'</i>'+esc(p.name)+'</button>').join('')+'</div>';
   else if(k==='balance')h+='<div class="paper"><strong>둘 중 하나를 선택해!</strong></div>'+q.options.map((x,i)=>'<button class="choice '+(pick===String(i)?'sel':'')+'" data-act="pick" data-v="'+i+'" '+(answered?'disabled':'')+'>'+(i?'B. ':'A. ')+esc(x)+'</button>').join('');
   else h+='<div class="paper"><strong>'+esc(k==='bomb'?q.text:q.options.join(' + '))+'</strong><p>'+(k==='bomb'?'서로 다른 답 3개를 쉼표로 구분해!':'키워드 2개 이상으로 황당한 뉴스 제목을 만들어!')+'</p></div><textarea id="answer" maxlength="140" '+(answered?'disabled':'')+' placeholder="'+(k==='bomb'?'예: 사과, 배, 바나나':'예: 펭귄이 지하철에서 피자 주문!')+'">'+esc(draft)+'</textarea>';
   h+=answered?'<div class="note">✅ 제출 완료! 다른 친구들을 기다려줘.</div>':k==='confession'&&q.owner===myId()?'<div class="note">이번 고백의 주인공은 너야! 다른 친구들의 추리를 기다려줘.</div>':btn('✅ 답변 제출','answer',false,'alt');
   h+='<p class="sub">제출 '+Object.keys(game.answers||{}).length+'명 · 제한 시간 30초</p>';if(host)h+=btn('방장: 결과 바로 공개','reveal',false,'ghost');
  }else if(game.phase==='result'){const delta=(game.result.delta||{})[myId()]||0;h+='<div class="hero"><div class="em">🎉🏆🎉</div><h2>'+esc(game.result.title)+'</h2><p class="sub">'+esc(game.result.detail)+'</p><div class="big">'+(delta>=0?'+':'')+delta+'점</div></div><h2>📊 현재 순위</h2>'+scores()+'<div class="note">결과를 확인한 뒤 방장이 다음 라운드 진행 버튼을 눌러야 계속됩니다.</div>';if(host)h+=btn(game.round+1>=game.total?'방장: 최종 결과 보기':'방장: 다음 라운드 진행','next',false,'primary')}
  else if(game.phase==='final'){const win=players.slice().sort((a,b)=>b.score-a.score)[0];h+='<div class="hero"><div class="em">🎊🏆🎊</div><h2>최종 시상식</h2><div style="font-size:66px">'+win.icon+'</div><h1>'+esc(win.name)+'</h1><p class="sub">'+win.score+'점으로 우승!</p></div>'+scores();if(host)h+=btn('🔄 다시 하기','restart')}
  h+=btn('방 나가기','leave',false,'ghost');
 }
 root.innerHTML=h+speechSettingsHtml();
 narrationOnDraw();
}
function loadUsed(){try{const o=JSON.parse(localStorage.getItem('ynn_used_questions_v4')||'{}');used=o&&typeof o==='object'?o:{}}catch(e){used={}}}
function saveUsed(){try{localStorage.setItem('ynn_used_questions_v4',JSON.stringify(used))}catch(e){}}
function nextKind(){if(!queue.length){queue=shuffle(kinds.slice());if(queue[0]===lastKind&&queue.length>1)[queue[0],queue[1]]=[queue[1],queue[0]]}lastKind=queue.shift();return lastKind}
function takeQuestion(k){let seen=Array.isArray(used[k])?used[k].filter(n=>Number.isInteger(n)&&n>=0&&n<bank[k].length):[];let remaining=bank[k].map((_,i)=>i).filter(i=>!seen.includes(i));if(!remaining.length){seen=[];remaining=bank[k].map((_,i)=>i)}const ix=remaining[rnd(remaining.length)];used[k]=seen.concat(ix);saveUsed();return bank[k][ix]}
function newRound(){const k=nextKind(),item=takeQuestion(k);game.q={kind:k,text:typeof item==='string'?item:'',options:Array.isArray(item)?item:[],owner:k==='confession'?players[rnd(players.length)].id:''};game.phase='question';game.answers={};game.deadline=Date.now()+30000;pick='';draft='';localSubmitted=false;sync();if(practice)bots()}
function start(){if(!host||players.length<2)return;loadUsed();queue=[];lastKind='';players.forEach(p=>p.score=0);game.round=0;newRound()}
function accept(id,val,round){if(!host||game.phase!=='question'||round!==game.round||!players.some(p=>p.id===id&&p.online!==false)||Object.prototype.hasOwnProperty.call(game.answers,id))return;const k=game.q.kind;if(k==='confession'&&id===game.q.owner)return;if((k==='vote'||k==='confession')&&!players.some(p=>p.id===val&&p.id!==id))return;if(k==='balance'&&val!=='0'&&val!=='1')return;if((k==='bomb'||k==='news')&&(typeof val!=='string'||val.length>140))return;game.answers[id]=val;sync();const req=players.filter(p=>p.online!==false&&(k!=='confession'||p.id!==game.q.owner)).length;if(Object.keys(game.answers).length>=req)setTimeout(()=>{if(game.phase==='question')reveal()},450)}
function bots(){if(!practice||game.phase!=='question')return;const q=game.q;players.slice(1).forEach(p=>{if(q.kind==='confession'&&p.id===q.owner)return;const v=q.kind==='vote'||q.kind==='confession'?players.filter(x=>x.id!==p.id)[rnd(players.length-1)].id:q.kind==='balance'?String(rnd(2)):q.kind==='bomb'?'사과, 배, 바나나':q.options.join(' ')+' 속보!';accept(p.id,v,game.round)})}
function reveal(){if(!host||game.phase!=='question')return;const q=game.q,k=q.kind,ans=game.answers,delta={};let title='',detail='';players.forEach(p=>delta[p.id]=0);
 if(k==='vote'){const c={};Object.values(ans).forEach(id=>c[id]=(c[id]||0)+1);const high=Math.max(0,...Object.values(c)),wins=Object.keys(c).filter(id=>c[id]===high&&high>0);Object.entries(ans).forEach(x=>{if(wins.includes(x[1]))delta[x[0]]+=2});title=wins.length?'👀 최다 지목: '+wins.map(id=>players.find(p=>p.id===id).name).join(', '):'👀 투표 결과';detail='최다 '+high+'표 · 맞힌 친구 +2점'}
 if(k==='balance'){const a=Object.values(ans).filter(v=>v==='0').length,b=Object.values(ans).filter(v=>v==='1').length;Object.entries(ans).forEach(x=>{if(a===b)delta[x[0]]=1;else if((x[1]==='0'&&a<b)||(x[1]==='1'&&b<a))delta[x[0]]=3});title='⚖️ 소수파 결과';detail='A '+a+'명 · B '+b+'명'}
 if(k==='bomb'){Object.entries(ans).forEach(x=>{const v=String(x[1]).split(/[,，\n]+/).map(s=>s.trim()).filter(Boolean);delta[x[0]]=new Set(v).size>=3?3:-2});title='💣 폭탄 미션 결과';detail='서로 다른 답 3개면 +3점'}
 if(k==='confession'){Object.entries(ans).forEach(x=>{if(x[1]===q.owner)delta[x[0]]=3});title='🕵️ 정답: '+players.find(p=>p.id===q.owner).name;detail='맞힌 친구 +3점'}
 if(k==='news'){Object.entries(ans).forEach(x=>{const v=String(x[1]);if(v.length>=10&&q.options.filter(w=>v.includes(w)).length>=2)delta[x[0]]=4});title='📺 뉴스 결과';detail='키워드 2개 + 10글자 이상이면 +4점'}
 players.forEach(p=>p.score=Math.max(0,p.score+delta[p.id]));game.phase='result';game.result={title,detail,delta};game.deadline=0;sync()}
function next(){if(!host||game.phase!=='result')return;if(game.round+1>=game.total){game.phase='final';game.deadline=0;sync()}else{game.round++;newRound()}}
root.addEventListener('input',e=>{if(e.target.id==='answer')draft=e.target.value});
root.addEventListener('change',speechSettingsChange);
root.addEventListener('click',e=>{const b=e.target.closest('button[data-act]');if(!b||b.disabled)return;const a=b.dataset.act;
 if(a==='speechPreview'){activateSpeech();speak('안녕하세요! 야, 너잖아! 게임 진행을 맡은 엠씨입니다. 준비되셨나요?',true);return}
 activateSpeech();
 if(a==='create')create();else if(a==='join')join();else if(a==='practice')practiceStart();else if(a==='leave')reset();else if(a==='share')share();else if(a==='copyLink')copyLink();else if(a==='copyCode')copyText(code).then(ok=>say(ok?'방 코드 복사 완료!':'복사가 안 되면 화면의 4자리 코드를 알려줘.'));else if(a==='help'){help=!help;draw()}
 else if(a==='start')start();else if(a==='pick'){pick=b.dataset.v;draw()}else if(a==='answer'){const k=game.q.kind,v=(k==='bomb'||k==='news')?document.getElementById('answer').value.trim():pick;if(!v){say('답을 선택하거나 입력해줘.');return}if(host)accept(myId(),v,game.round);else if(conn&&conn.open){conn.send({type:'answer',round:game.round,value:v});localSubmitted=true;say('답변을 보냈어. 결과를 기다려줘.')}else say('연결이 끊겼어. 다시 입장해줘.')}
 else if(a==='reveal')reveal();else if(a==='next')next();else if(a==='restart'){game={phase:'lobby',round:0,total:game.total};players.forEach(p=>p.score=0);sync()}});
setInterval(()=>{const t=document.getElementById('timer');if(t&&game.deadline){const left=Math.max(0,Math.ceil((game.deadline-Date.now())/1000));t.textContent=left;const roundKey=code+'|'+game.round;if(mode==='room'&&game.phase==='question'&&left<=10&&left>0&&warnedRound!==roundKey){warnedRound=roundKey;speak('이제 열 초 남았어요. 아직 선택하지 않았다면, 서둘러 주세요!')}}if(host&&mode==='room'&&game.deadline&&Date.now()>=game.deadline){if(game.phase==='question')reveal()}},1000);
draw();
})();

</script></body></html>
